[package]
name = "feth-bench-exp"
version = "0.1.2"
edition = "2021"
description = "Catch-up experience for benched Fire Emblem: Three Houses units"
license = "MIT"
publish = false
repository = "https://github.com/jinghaihan/feth-bench-exp"

[package.metadata.skyline]
titleid = "010055D009F78000"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git", rev = "6b52d321275639f26c2371d8142550ba0013a5e4" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
